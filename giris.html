<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap | Hello Development</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0a0a0a;
            background-image: radial-gradient(circle at 50% 0%, #2a0a3a 0%, #0a0a0a 60%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background-color: #151515;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 40px;
            width: 300px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(157, 78, 221, 0.2);
        }
        .login-box h2 {
            color: #c77dff;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            background-color: #0a0a0a;
            border: 1px solid #444;
            border-radius: 5px;
            color: white;
            box-sizing: border-box;
            outline: none;
        }
        input:focus {
            border-color: #9d4edd;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #9d4edd;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background-color: #c77dff;
            box-shadow: 0 0 15px rgba(157, 78, 221, 0.6);
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Giriş Yap</h2>
        <form action="index.html">
            <input type="text" placeholder="Kullanıcı Adı" required>
            <input type="password" placeholder="Şifre" required>
            <!-- Butona basınca index.html'e yönlendirir -->
            <button type="submit">Giriş Yap</button>
        </form>
    </div>

</body>
</html>
