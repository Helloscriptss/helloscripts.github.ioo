<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giriş Yap / Üye Ol · Hello Scripts</title>
  <style>
    :root { color-scheme: dark; --bg:#090d0d; --surface:#101717; --text:#f2f6f4; --muted:#9baaa6; --line:rgba(224,255,246,.09); --green:#4ce0ae; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background-color: var(--bg); color: var(--text); font-family: Arial, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .auth-container { max-width: 400px; width: 100%; background: var(--surface); padding: 35px; border-radius: 12px; border: 1px solid var(--line); }
    .auth-tabs { display: flex; margin-bottom: 25px; border-bottom: 1px solid var(--line); }
    .auth-tab { flex: 1; text-align: center; padding: 10px; font-weight: bold; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; transition: .2s; }
    .auth-tab.active { color: var(--green); border-bottom-color: var(--green); }
    .auth-form { display: none; }
    .auth-form.active { display: block; }
    .auth-form h2 { color: var(--green); margin-top: 0; text-align: center; }
    .auth-form input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: white; outline: none; }
    .auth-form button { width: 100%; padding: 12px; border: none; border-radius: 8px; background: var(--green); color: #090d0d; font-weight: bold; font-size: 16px; cursor: pointer; }
    .auth-form button:hover { filter: brightness(1.1); }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-tabs">
      <div class="auth-tab active" onclick="showTab('login')">Giriş Yap</div>
      <div class="auth-tab" onclick="showTab('register')">Üye Ol</div>
    </div>
    <div id="login" class="auth-form active">
      <h2>Tekrar Hoş Geldin</h2>
      <form>
        <input type="text" placeholder="Kullanıcı Adı" required>
        <input type="password" placeholder="Şifre" required>
        <button type="button" onclick="loginUser()">Giriş Yap</button>
      </form>
    </div>
    <div id="register" class="auth-form">
      <h2>Aramıza Katıl</h2>
      <form>
        <input type="text" placeholder="Kullanıcı Adı" required>
        <input type="email" placeholder="E-posta" required>
        <input type="password" placeholder="Şifre" required>
        <button type="button" onclick="loginUser()">Kayıt Ol</button>
      </form>
    </div>
  </div>

  <script>
    function showTab(tabId) {
      document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
      document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      if(tabId === 'login') document.querySelectorAll('.auth-tab')[0].classList.add('active');
      else document.querySelectorAll('.auth-tab')[1].classList.add('active');
    }

    // GİRİŞ FONKSİYONU
    function loginUser() {
      localStorage.setItem('isLoggedIn', 'true'); 
      window.location.href = 'index.html'; 
    }
  </script>
</body>
</html>
