<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş / Kayıt | Hello Development</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0a0a0a;
            background-image: radial-gradient(circle at 50% 0%, #2a0a3a 0%, #0a0a0a 60%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-box {
            background-color: #151515;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 30px;
            width: 350px;
            box-shadow: 0 10px 30px rgba(157, 78, 221, 0.2);
            position: relative;
            overflow: hidden;
        }

        /* Sekmeler (Giriş / Üye Ol) */
        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 1px solid #333;
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: #888;
            padding: 10px;
            font-size: 1.1em;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .tab-btn.active {
            color: #c77dff;
            border-bottom: 2px solid #9d4edd;
        }

        /* Form Alanı */
        .form-content {
            display: none; /* Başlangıçta gizli */
        }

        .form-content.active {
            display: block; /* Aktif olan görünür */
        }

        h2 {
            color: #c77dff;
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 1.5em;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background-color: #0a0a0a;
            border: 1px solid #444;
            border-radius: 5px;
            color: white;
            box-sizing: border-box;
            outline: none;
        }

        input:focus {
            border-color: #9d4edd;
        }

        button[type="submit"] {
            width: 100%;
            padding: 12px;
            background-color: #9d4edd;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        button[type="submit"]:hover {
            background-color: #c77dff;
            box-shadow: 0 0 15px rgba(157, 78, 221, 0.6);
        }
    </style>
</head>
<body>

    <div class="login-box">
        <!-- Sekmeler -->
        <div class="tabs">
            <button class="tab-btn active" onclick="openTab('giris')">Giriş Yap</button>
            <button class="tab-btn" onclick="openTab('kayit')">Üye Ol</button>
        </div>

        <!-- Giriş Formu -->
        <div id="giris" class="form-content active">
            <h2>Giriş Yap</h2>
            <form action="anasayfa.html">
                <input type="text" placeholder="Kullanıcı Adı" required>
                <input type="password" placeholder="Şifre" required>
                <button type="submit">Giriş Yap</button>
            </form>
        </div>

        <!-- Kayıt Formu -->
        <div id="kayit" class="form-content">
            <h2>Üye Ol</h2>
            <form action="giris.html">
                <input type="text" placeholder="Kullanıcı Adı" required>
                <input type="email" placeholder="E-posta Adresi" required>
                <input type="password" placeholder="Şifre" required>
                <input type="password" placeholder="Şifre Tekrar" required>
                <button type="submit">Kayıt Ol</button>
            </form>
        </div>
    </div>

    <!-- Sekme Değiştirme Mantığı (JavaScript) -->
    <script>
        function openTab(tabName) {
            // Tüm form içeriklerini gizle
            var i;
            var x = document.getElementsByClassName("form-content");
            for (i = 0; i < x.length; i++) {
                x[i].classList.remove("active");
            }
            // Tüm sekme butonlarındaki aktifliği kaldır
            var btn = document.getElementsByClassName("tab-btn");
            for (i = 0; i < btn.length; i++) {
                btn[i].classList.remove("active");
            }
            // Tıklanan sekmeyi ve formu aktif et
            document.getElementById(tabName).classList.add("active");
            event.currentTarget.classList.add("active");
        }
    </script>

</body>
</html>
