<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giriş Yap · Hello Scripts</title>
  <style>
    :root { color-scheme: dark; --bg:#090d0d; --surface:#101717; --text:#f2f6f4; --muted:#9baaa6; --line:rgba(224,255,246,.09); --green:#4ce0ae; }
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;line-height:1.6; display:flex; flex-direction:column; min-height:100vh;} a{text-decoration:none;color:inherit}
    .container{width:min(1180px,calc(100% - 40px));margin-inline:auto}
    .announcement{padding:10px;background:#12352c;color:#c7f6e4;text-align:center;font-size:12px;font-weight:bold}
    header{position:sticky;top:0;z-index:20;background:#090d0d;border-bottom:1px solid var(--line);padding:15px 0}
    .nav{display:flex;align-items:center;justify-content:space-between}
    .brand{display:flex;align-items:center;gap:10px;font-weight:bold;font-size:18px}
    .brand-icon{background:var(--green);color:#090d0d;padding:8px 12px;border-radius:8px;font-size:20px}
    .links{display:flex;gap:20px;align-items:center}
    .links a{color:var(--muted);font-size:13px;font-weight:bold;transition:.2s}
    .links a:hover, .links a.active{color:var(--green)}
    .btn-giris{background:var(--green);color:#090d0d !important;padding:8px 15px;border-radius:8px}
    .login-box{max-width:400px; margin: 80px auto; background:var(--surface); padding:40px; border-radius:12px; border:1px solid var(--line); text-align:center;}
    .login-box h2{color:var(--green); margin-top:0;}
    .login-box input{width:100%; padding:12px; margin-bottom:15px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:white;}
    .login-box button{width:100%; padding:12px; border:none; border-radius:8px; background:var(--green); color:#090d0d; font-weight:bold; font-size:16px; cursor:pointer;}
    footer{text-align:center;padding:30px;border-top:1px solid var(--line);color:var(--muted);font-size:12px; margin-top:auto;}
  </style>
</head>
<body>
  <div class="announcement">✦ HELLO SCRIPTS TOPLULUĞUNA HOŞ GELDİNİZ ✦</div>
  <header>
    <div class="container nav">
      <div class="brand"><span class="brand-icon">H</span> HELLO SCRIPTS</div>
      <div class="links">
        <a href="index.html">Ana Sayfa</a>
        <a href="mods.html">Modlar</a>
        <a href="scripts.html">Scriptler</a>
        <a href="free.html">Ücretsiz</a>
        <a href="anticheat.html">Anti-Cheat</a>
        <a href="mlo.html">MLO</a>
        <a href="giris.html" class="btn-giris active">Giriş Yap</a>
      </div>
    </div>
  </header>
  <main class="container">
    <div class="login-box">
      <h2>Giriş Yap</h2>
      <p style="color:var(--muted); font-size:14px; margin-bottom:30px;">Hesabınıza giriş yapın</p>
      <form>
        <input type="text" placeholder="Kullanıcı Adı">
        <input type="password" placeholder="Şifre">
        <button type="button">Giriş Yap</button>
      </form>
    </div>
  </main>
  <footer>© 2026 Hello Scripts. Tüm hakları saklıdır.</footer>
</body>
</html>
